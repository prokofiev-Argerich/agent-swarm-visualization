services:
  postgres:
    image: postgres:17-alpine
    container_name: swarm-ide-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swarm_ide
    ports:
      - "5432:5432"
    volumes:
      - swarm_ide_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swarm_ide"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: swarm-ide-redis
    ports:
      - "6379:6379"
    volumes:
      - swarm_ide_redis:/data

volumes:
  swarm_ide_pg:
  swarm_ide_redis:
